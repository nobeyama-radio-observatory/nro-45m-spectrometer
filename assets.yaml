# 資産の台帳：45m 鏡の分光計
# 項目の定義はハブの assets/README.md を参照。
#   https://github.com/nobeyama-radio-observatory/nro-context/blob/main/assets/README.md
# 2026-11-18 に、ハブの仮置きの台帳（assets/nro45m.yaml）から移した（判断記録 0006）。
# 公開資料から AI が埋め、聞き取り（interviews/）で補った。
#
# この台帳にない id の置き場所は、ハブの assets/README.md の資産の索引で引ける。
# nro45m は nro-45m-antenna、sw-cosmos は nro-45m-control、if-system は nro-45m-if。
#
# 出典の略記
#   データシート：45m 鏡のデータシート https://www.nro.nao.ac.jp/en/projects/45m/datasheets/ （2026-11-18 に確認）
#   障害情報：NRO45m 障害情報 https://www.nro.nao.ac.jp/projects/45m/projects-45m-trouble/ （2026年11月12日更新の版）
#   年次報告YYYY：https://www.nao.ac.jp/contents/about/reports/annual-report-ja/annualYYYY-j.pdf
#   プロポーザルの募集：https://www.nro.nao.ac.jp/projects/45m/proposals/calls/
#   聞き取りYYYY-MM-DD 問N：interviews/YYYY-MM-DD.md の問N

- id: be-sam45
  name: SAM45（分光計）
  kind: 分光計
  part_of: nro45m
  depends_on: [if-system]
  status: 一部運用
  offered: 提供
  introduced: 2009年度に導入（アルマの ACA 相関器と同じ型）。2010年1月に一部を共同利用に公開
  maintenance:
    by: 所内
    condition: >-
      完成から時間が経ち、マザーボードや機能ボードの故障が増えている。故障の対応は年に数回で、予備品と交換している。
      2026年11月に、16アレイを処理する部分の一つのマザーボードが故障した。同じ故障は過去に3回以上あり、予備のマザーボードは使い果たした。
      故障したアレイ（A05〜A08。SpW モードでは A21〜A24 も）は無効化し（障害情報の「エミュレータ化」）、代わりに YATSUGATAKE でデータを取っている。アレイ数の4分の3で運用を続けている。
      メーカーの保証は切れており、メーカーの支援はない。保守に必要な文書はすべて所内にある。作業は、判断できる2名に加えて外部の技術支援者1名が行う
    effort: 中
  renewal: 故障したところから YATSUGATAKE に切り替えていく。2026年11月の時点で4分の1を切り替えた。RFSoC の調達に時間がかかっており、完全な移行は早ければ2027年度末（仮説）
  owner_role: 計算機グループ
  maintainers: 2
  repos:
    - {name: YATSUGATAKE-NRO45-sam45compat, url: https://github.com/nobeyama-radio-observatory/YATSUGATAKE-NRO45-sam45compat}
    - {name: nro45-interfaces, url: https://github.com/nobeyama-radio-observatory/nro45-interfaces}
  docs:
    - SAM45 のページ（構成、帯域と分解能の組み合わせ、SpW モード、IF の割り当て、観測のモード） https://www.nro.nao.ac.jp/projects/sam45/
    - 観測者向けの障害の対処：トラブルシューティングのページが作られているが、開けない（ハブの users/README.md の「一次資料の食い違いと欠け」8）
    - いま使えないアレイ：プロポーザル募集 https://www.nro.nao.ac.jp/projects/45m/proposals/calls/ の Spectrometer の節、障害情報 https://www.nro.nao.ac.jp/projects/45m/projects-45m-trouble/ （2026-11-19 に確認）
  sources:
    - 導入：年次報告2009、年次報告2010
    - 保守と更新：障害情報 Trouble ID 2026-1
    - 保守の手間と状況：聞き取り2026-11-18 問1、問2、問7
    - 担い手の数：聞き取り2026-11-18 問2
    - 更新の見込み：聞き取り2026-11-18 問3
    - 担当：聞き取り2026-11-18 問0、問9
  note: >-
    最大帯域 2 GHz（4096チャンネル）の16アレイからなる（年次報告2010）。
    nro-work の業務「SAM45 の障害対応」（2026-11 の書き出し）では単独で判断できる人を1としているが、一部の関係者の判断レベルが未記入のため。
    この台帳の担い手の数（2）は聞き取りによる

- id: be-yatsugatake
  name: YATSUGATAKE（分光計）
  kind: 分光計
  part_of: nro45m
  depends_on: [if-system]
  status: 試験中
  offered: リスクシェアで提供
  introduced: 2026年11月12日に試験的な科学運用を開始
  maintenance:
    by: 所内
    condition: 長期の稼働で見つかる問題の確認と、その修正が中心（2026年11月の時点）。開発する人と保守する人が同じ
    effort: 中
  renewal: SAM45 の後継。リスクシェアを終えて正式に提供する時期は未定で、SAM45 からの切り替えを終える時期（早ければ2027年度末）と同じ（仮説）
  owner_role: 計算機グループ
  maintainers: 1
  docs:
    - 保守のマニュアルはまだない。作成して計算機グループに展開する予定（時期は未定）
    - 利用者向けのマニュアル（Manual of YATSUGATAKE、2026-11-12 版。プロポーザル募集から） https://www.nro.nao.ac.jp/wp-content/uploads/2026/11/yksp-manual-20261112-en.pdf （2026-11-19 に確認）
  repos:
    - {name: YATSUGATAKE, url: https://github.com/nobeyama-radio-observatory/YATSUGATAKE}
    - {name: study-rfsoc, url: https://github.com/ars096/study-rfsoc}
    - {name: nro45-interfaces, url: https://github.com/nobeyama-radio-observatory/nro45-interfaces}
  sources:
    - 導入：障害情報 Trouble ID 2026-1
    - 提供：プロポーザルの募集（SAM45 の使えないアレイの代わりに、試験観測の段階として提供）
    - 後継の位置づけ：YATSUGATAKE の README https://github.com/nobeyama-radio-observatory/YATSUGATAKE
    - 保守の手間と状況、担い手の数、資料：聞き取り2026-11-18 問4（手間は回答者の見立て）、問5
    - 正式な提供の時期：聞き取り2026-11-18 問3、問6
    - 担当：聞き取り2026-11-18 問0、問9

- id: sw-sam45compat
  name: SAM45 互換のソフトウェア（YATSUGATAKE で SAM45 の故障したアレイを肩代わりする）
  kind: ソフトウェア
  part_of: be-sam45
  depends_on: [be-sam45, be-yatsugatake, sw-cosmos]
  status: 試験中
  maintenance: {by: 所内, condition: 未記入, effort: 中}
  renewal: SAM45 が廃止され、分光計が YATSUGATAKE に一本化された時点で archive する。最終版の連携ソフトウェア（YKSP-LC）は COSMOS のマネージャーにつながる予定（nro-45m-control の interviews/2026-11-18.md 問6）
  owner_role: 計算機グループ
  maintainers: 1
  repos:
    - {name: YATSUGATAKE-NRO45-sam45compat, url: https://github.com/nobeyama-radio-observatory/YATSUGATAKE-NRO45-sam45compat}
    - {name: nro45-interfaces, url: https://github.com/nobeyama-radio-observatory/nro45-interfaces}
  sources:
    - YATSUGATAKE-NRO45-sam45compat の README https://github.com/nobeyama-radio-observatory/YATSUGATAKE-NRO45-sam45compat （既存の COSMOS を使い、改修は最小限にとどめる）
    - 保守の手間、担い手の数：聞き取り2026-11-18 問8（YATSUGATAKE と同じという見立て）
    - 役割：聞き取り2026-11-18 問7
    - 担当：聞き取り2026-11-18 問0、問9
  note: SAM45 の無効化したアレイの代わりに、YATSUGATAKE で SAM45 と同じ形式のデータ（YKSP）を取るためのもの。無効化したアレイは、SpW モードでない観測では A05〜A08、SpW モードでは A05〜A08 と A21〜A24（プロポーザルの募集、2026-11-18 に確認）。台帳と聞き取りの「A05〜A08」は SpW モードでない場合、互換のソフトウェアの README の「A21〜A24 も含む」は SpW モードの場合にあたる

- id: sw-sam45compat-lc
  name: 暫定の Local Controller（YKSP の観測時系列データを書く。SAM45 互換のソフトウェアの一部）
  kind: ソフトウェア
  part_of: sw-sam45compat
  depends_on: [be-yatsugatake, be-sam45]
  status: 試験中
  maintenance: {by: 所内, condition: 未記入, effort: 未記入}
  renewal: 暫定。YATSUGATAKE の最終版の連携ソフトウェア（YKSP-LC）が COSMOS のマネージャーにつながったら、役目を終える（nro-45m-control の interviews/2026-11-18.md 問6）。最終版は構成から作り直し、このソフトウェアを土台にしない（YATSUGATAKE-NRO45-sam45compat の README）
  owner_role: 計算機グループ
  maintainers: 1
  repos:
    - {name: YATSUGATAKE-NRO45-sam45compat, url: https://github.com/nobeyama-radio-observatory/YATSUGATAKE-NRO45-sam45compat}
    - {name: nro45-interfaces, url: https://github.com/nobeyama-radio-observatory/nro45-interfaces}
  sources:
    - 役割（SAM45 の観測時系列データから設定と時刻を受け取り、YATSUGATAKE で分光して、SAM45 と同じ形式の観測時系列データ（YKSP）を書く。観測が終わったら配信の場所に移し、マージに渡す）：YATSUGATAKE-NRO45-sam45compat の README、docs/plan.md の5
    - COSMOS のマネージャーは改修しない：YATSUGATAKE-NRO45-sam45compat の README の「設計の方針」1
    - 担い手の数：sw-sam45compat と同じ（聞き取り2026-11-18 問8 の、YATSUGATAKE と同じという見立て）
  note: >-
    マネージャーにはつながらず、SAM45 の観測時系列データを追いかけて動く。そのため、マネージャーは YKSP の装置の状態を受け取れない（仮説。observation-flow.md の2 の、通常の Local Controller とは状態を常にやりとりしているという記述から）。
    書いた観測時系列データの配信と保管は、nro-data の db-yksp-delivery
